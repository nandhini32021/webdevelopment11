<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--datalist tag-->
    <label>Food</label>
<input list="food">
    <datalist id="food">
      
        <option value="pizza">
        <option value="burger">
        <option value="coke">
        <option value="chicken">
        <option value="deserts">
        <option value="beverage">

    </datalist>

<label>LOcation</label>
<input list="city">
    <datalist id="city">
<option value="Hyderbad">
        <option value="Banglore">
        <option value="chennai">
        <option value="Tirupati">
        <option value="delhi">
        <option value="bangaladesh">

    </datalist>
</body>
</html>
